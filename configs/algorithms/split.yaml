algorithm_id: split_miner
display_name: Split Miner
backend: external
supported: true
pm4py_api:
  simplified_function: null
  lower_level_module: null
model_type: bpmn
default_params:
  jar_path: data/external/split-miner-1.7.1-all.jar
  jar_sha256: 472c006623d99a6e440aa93a58e29b867cc331cec2b12b3d7fb61fb2a5de8328
  jar_env_var: SPLIT_MINER_JAR
  java_bin: null
  java_options:
  - -Xms64m
  - -Xmx3g
  - -XX:MaxMetaspaceSize=256m
  - -Xss512k
  - -Djava.awt.headless=true
  timeout_seconds: 86400
  epsilon: 0.1
  eta: 0.2
  parallelismFirst: false
  removeLoopActivityMarkers: false
  replaceIORs: false
  diagram: false
runtime_params:
  - timeout_seconds
search_space:
  epsilon:
    type: float
    values: [0.0, 0.1, 0.2, 0.4, 0.6]
  diagram:
    type: categorical
    values: [false]
  eta:
    type: float
    values: [0.0, 0.2, 0.4, 0.6, 0.8]
  parallelismFirst:
    type: categorical
    values: [false, true]
  removeLoopActivityMarkers:
    type: categorical
    values: [false, true]
  replaceIORs:
    type: categorical
    values: [false, true]
notes:
  - "External Java backend using iharsuvorau/split-miner 1.7.1 CLI flags."
  - "jar_path defaults to data/external/split-miner-1.7.1-all.jar; SPLIT_MINER_JAR can still be used when jar_path is null or omitted in an explicit config."
  - "jar_sha256 pins the accepted Split Miner 1.7.1 artifact."
  - "java_bin defaults to null so JAVA_BIN can select a Java 8 runtime without regenerating a custom algorithm config."
  - "java_options bounds each Split Miner JVM to reduce node-level native-memory and metaspace failures under concurrent runs."
  - "timeout_seconds is an external-process runtime limit; the default is 24 hours."
  - "Only the Split Miner 1.7.1 CLI parameter schema is supported."
  - "diagram is fixed false in the default search because BPMN DI layout can add runtime without changing the discovered control-flow model."
