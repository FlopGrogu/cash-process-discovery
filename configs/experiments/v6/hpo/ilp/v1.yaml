seeds:
- 42
output:
  results_dir: results/cluster/v6/model/hpo/ilp/v1
  log_dir: logs/slurm/v6/model/hpo/ilp/v1
  output_path_template: '{results_dir}/{log_id}/{config_hash}.json'
manifest_path: experiments/manifests/v6/model/hpo/ilp/v1.csv
metrics:
  enabled: true
  profile: token
  names:
  - fitness
  - precision
  - generalization
  - simplicity
  export_model: true
algorithms:
- name: ilp_miner
  algorithm_id: ilp_miner
  backend: pm4py
  model_type: petri_net
  runtime_params:
  - discovery_timeout_seconds
  - metric_timeout_seconds
  default_params:
    discovery_timeout_seconds: 240
    metric_timeout_seconds: 1800
  search_space_override:
    alpha:
      min: 0.0
      max: 1.0
      type: float
      scale: linear
hpo:
  n_trials: 100
  n_startup_trials: 10
  sampler_seed: 42
  per_trial_walltime_seconds: 2400
  objective:
    weights:
      fitness: 1.0
      precision: 1.0
      generalization: 1.0
      simplicity: 1.0
    failed_trial_value: 0.0
