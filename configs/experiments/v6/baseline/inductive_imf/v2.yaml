experiment_id: v6_baseline_inductive_imf_v2
logs_from: ../../../../log_sets/v6_real_logs.yaml
seeds: [42]
output:
  results_dir: results/cluster/v6/model/baseline/inductive_imf
  log_dir: logs/slurm/v6/model/baseline/inductive_imf/v2
  output_path_template: "{results_dir}/{log_id}/{config_hash}.json"
manifest_path: experiments/manifests/v6/model/baseline/inductive_imf/v2.csv
metrics: {enabled: false, profile: token, names: [fitness, precision, generalization, simplicity], export_model: true}
algorithms:
  - name: inductive_miner_imf
    algorithm_id: inductive_miner_imf
    artifact_algorithm_id: inductive_miner
    backend: pm4py
    model_type: petri_net
    runtime_params: [discovery_timeout_seconds, recursion_limit]
    configs:
      - {variant: imf, noise_threshold: 0.0, disable_fallthroughs: false, multi_processing: false, recursion_limit: 10000, discovery_timeout_seconds: 240}
