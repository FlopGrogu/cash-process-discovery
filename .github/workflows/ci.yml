name: v6 reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: training_data
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            training_data/requirements.txt
            training_data/environments/gedi/requirements.txt

      - name: Install pinned environments
        run: make env

      - name: Run v6 acceptance checks
        run: make check

      - name: Confirm checks did not mutate tracked source
        run: git diff --exit-code

      - name: Build source-only submission archive deterministically
        shell: bash
        run: |
          make submission-archive
          first_sha="$(cut -d ' ' -f 1 submission-dist/process-discovery-cash-v6.tar.gz.sha256)"
          make submission-archive
          second_sha="$(cut -d ' ' -f 1 submission-dist/process-discovery-cash-v6.tar.gz.sha256)"
          test "${first_sha}" = "${second_sha}"

      - name: Validate archive checksum and contents
        run: >-
          python scripts/verify_submission_archive.py
          submission-dist/process-discovery-cash-v6.tar.gz
