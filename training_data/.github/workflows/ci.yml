name: v6 reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      UV_FROZEN: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.13"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            environments/gedi/uv.lock

      - name: Install frozen environments
        run: make env

      - name: Run v6 acceptance checks
        run: make check

      - name: Confirm checks did not mutate tracked source
        run: git diff --exit-code

      - name: Build source-only submission archive
        shell: bash
        run: |
          make submission-archive
          first_sha="$(cut -d ' ' -f 1 submission-dist/process-discovery-cash-v6.tar.gz.sha256)"
          make submission-archive
          second_sha="$(cut -d ' ' -f 1 submission-dist/process-discovery-cash-v6.tar.gz.sha256)"
          test "${first_sha}" = "${second_sha}"

      - name: Validate archive checksum and contents
        shell: bash
        run: |
          python scripts/verify_submission_archive.py \
            submission-dist/process-discovery-cash-v6.tar.gz
